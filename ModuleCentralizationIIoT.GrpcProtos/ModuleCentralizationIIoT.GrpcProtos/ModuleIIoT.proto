﻿syntax = "proto3";

option csharp_namespace = "CarDealer.GrpcProtos";

package GrpcProtos;

﻿import "google/protobuf/wrappers.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "common.proto";

service ModuleIIoT{
	rpc CreateModuleIIoT (CreateModuleIIoTRequest) returns (ModuleIIoTDTO);
	rpc GetModuleIIoT (GetRequest) returns (NullableModuleIIoTDTO);
	rpc GetAllModuleIIoT (google.protobuf.Empty) returns (Messages);
	rpc UpdateModuleIIoT (ModuleIIoTDTO) returns (google.protobuf.Empty);
	rpc DeleteModuleIIoT (DeleteMOduleIIoT) returns (google.protobuf.Empty);
}

message ModuleIIoTDTO{
	string id=1;
	string name=2;
	string addressIp=2;
	string accessport=3;
	bool isConnected=4;
}

message ModuleIIoT{
	repeated ModuleIIoTDTO items = 1;
}

message NullableModuleIIoTDTO{
	oneof kind{
		google.protobuf.NullValue null = 1;
		ModuleIIoTDTO moduleIIoT = 2;
	}

}
message CreateModuleIIoT{
	string name=1;
	string addressIp=2;
	bool isConnected=3;
}